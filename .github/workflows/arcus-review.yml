# ARCUS review bot (https://github.com/jam2in/arcus-review-bot).
# Generated by its scripts/install.sh. Review job: jam2in/arcus-review-bot/.github/workflows/review.yml@main
name: ARCUS Review

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: read
    uses: jam2in/arcus-review-bot/.github/workflows/review.yml@main
    with:
      skill: arcus-py-review
      local_skill: false
    secrets: inherit
