# ARCUS review bot: the review job. Target repositories call it from a small
# workflow generated by scripts/install.sh (template: workflows/arcus-review.yml).
#
#   remote  The target calls jam2in/arcus-review-bot/.github/workflows/review.yml@main.
#           Skills are checked out from this repository on every run, so rule
#           changes reach the target without a PR there. Only for private
#           repositories in the jam2in organization: GitHub does not let public
#           or outside repositories call a private repository's workflow.
#   copy    install.sh copies this file into the target as arcus-review-run.yml
#           and the skill into .claude/skills/ (naver/arcus-memcached,
#           naver/arcus-java-client, jam2in/arcus-py).
#
# Fork PRs do not get secrets on `pull_request`, so the caller uses
# `pull_request_target` / `issue_comment`, which run with the base repository's
# workflow and secrets. To keep that safe:
#   - the bot instructions never come from the PR: from this repository
#     (remote) or the target's DEFAULT branch (copy).
#   - the PR head is checked out read-only into ./pr and is never built or run.
#   - only people with write access trigger a review, and only on PRs authored
#     by people with write access (also for /arcus-review comments; job `gate`),
#     so Claude never reads an outsider's PR while holding the secrets.
#   - Claude gets read tools and writes the review to a file only (no build,
#     no push, no GitHub writes). A later step posts it as one COMMENT review.
#
# Requirements on the target repository:
#   - The caller workflow (and in copy mode .claude/skills/<skill>) must be on the
#     DEFAULT branch. pull_request_target (since 2025-12-08) and issue_comment
#     take the workflow and the default checkout from the default branch.
#   - Public repositories block pull_request_target by default from 2026-12-02.
#     A repository/org admin must allow it in an Actions event policy.
#   - Secret CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY, see the action step).
#   - remote: the jam2in GitHub App (variable ARCUS_REVIEW_APP_CLIENT_ID, secret
#     ARCUS_REVIEW_APP_PRIVATE_KEY), installed on the target and on
#     jam2in/arcus-review-bot with Contents read. Its token reads the skills.
#     copy: the App is optional and only changes the name and logo on reviews.
name: ARCUS Review (job)

on:
  workflow_call:
    inputs:
      skill:
        description: Review skill under skills/ (e.g. arcusdb-storage-review)
        type: string
        required: true
      default_model:
        description: "Overrides skills/<skill>/MODEL. auto (Opus when more than 20 C lines change, Sonnet otherwise) or a model id"
        type: string
        default: ""
      local_skill:
        description: true when .claude/skills/<skill> is in the caller's default branch (copy mode)
        type: boolean
        default: false
      bot_ref:
        description: Ref of jam2in/arcus-review-bot to read skills from (remote mode)
        type: string
        default: main

jobs:
  # Who may start a review: the PR author, and the commenter for /arcus-review,
  # must have write access to the repository. author_association is not used:
  # in event payloads it does not say MEMBER for private organization members.
  # This job has no secrets.
  gate:
    if: |
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/arcus-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # permission is admin, write, read or none (maintain counts as write).
          can_write() {
            p=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq .permission) || p=none
            echo "$1: $p"
            [ "$p" = admin ] || [ "$p" = write ]
          }
          allowed=true
          can_write "$PR_AUTHOR" || allowed=false
          if [ -n "$COMMENTER" ]; then can_write "$COMMENTER" || allowed=false; fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    # On the job, not the workflow: a workflow-level group would let any PR
    # comment (whose run is skipped by the `if` above) cancel a running review.
    concurrency:
      group: arcus-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The caller's job permissions are the upper limit.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read      # read the PR's CI results
      statuses: read
      actions: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      SKILL: ${{ inputs.skill }}
    steps:
      # Post as a custom GitHub App when one is configured, so the bot shows the
      # App's name and logo. Without it everything is posted as github-actions[bot].
      - name: App token
        id: app-token
        if: vars.ARCUS_REVIEW_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ARCUS_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCUS_REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      # Show that a /arcus-review comment was picked up. Runs started by opening
      # the PR already show up in the PR's checks.
      - name: Acknowledge
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null

      # The workspace root is the caller's default branch. In copy mode the bot
      # instructions (.claude/skills) come from here.
      # This is NOT the PR base (e.g. master vs develop). Never review against it.
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # remote mode: bot instructions come from this repository and are copied
      # over the root's .claude/skills. A separate App token, limited to this
      # repository and to reading contents, checks it out.
      - name: Bot repository token
        id: bot-token
        if: ${{ !inputs.local_skill }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ARCUS_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCUS_REVIEW_APP_PRIVATE_KEY }}
          owner: jam2in
          repositories: arcus-review-bot
          permission-contents: read

      - name: Checkout arcus-review-bot
        if: ${{ !inputs.local_skill }}
        uses: actions/checkout@v7
        with:
          repository: jam2in/arcus-review-bot
          ref: ${{ inputs.bot_ref }}
          path: .arcus-review-bot
          token: ${{ steps.bot-token.outputs.token }}
          persist-credentials: false
          sparse-checkout: |
            core
            scripts
            skills

      - name: Install skill
        id: bot
        if: ${{ !inputs.local_skill }}
        run: |
          sh .arcus-review-bot/scripts/sync_core.sh > /dev/null
          mkdir -p .claude/skills
          cp -R ".arcus-review-bot/skills/$SKILL" .claude/skills/
          rev=$(git -C .arcus-review-bot rev-parse --short HEAD)
          echo "arcus-review-bot $rev, skill $SKILL"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # PR head in a subdirectory, for reading only. Full history so that the
      # PR base branch and the merge-base are available for comparison.
      # actions/checkout refuses fork PR checkouts in pull_request_target by
      # default (2026-07). It is opted in here because the code is never built
      # or executed, credentials are not persisted, and Claude has read tools only.
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # A comment "/arcus-review opus" or "/arcus-review sonnet" picks the model
      # directly. Otherwise the skill's MODEL file (or the default_model input)
      # decides; with auto, Opus for PRs that change more than 20 lines of C
      # code (deep tracing of locks, refcounts, on-disk formats), Sonnet for the rest.
      - name: Pick model
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          INPUT_MODEL: ${{ inputs.default_model }}
        run: |
          case "$COMMENT" in
            "/arcus-review opus"*)   echo "model=claude-opus-5-5"   >> "$GITHUB_OUTPUT"; exit 0 ;;
            "/arcus-review sonnet"*) echo "model=claude-sonnet-5-5" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          DEFAULT_MODEL=$INPUT_MODEL
          if [ -z "$DEFAULT_MODEL" ] && [ -f ".claude/skills/$SKILL/MODEL" ]; then
            DEFAULT_MODEL=$(tr -d '[:space:]' < ".claude/skills/$SKILL/MODEL")
          fi
          DEFAULT_MODEL=${DEFAULT_MODEL:-auto}
          if [ "$DEFAULT_MODEL" != auto ]; then
            echo "model=$DEFAULT_MODEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          c_lines=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                      --jq '.[] | select(.filename | test("\\.(c|h)$")) | .additions + .deletions' \
                    | awk '{ s += $1 } END { print s + 0 }')
          if [ "$c_lines" -gt 20 ]; then model=claude-opus-5-5; else model=claude-sonnet-5-5; fi
          echo "changed C lines: $c_lines -> $model"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # OAuth token from `claude setup-token`, issued by the Claude seat the bot
          # runs on. Usage counts against that seat's limits.
          # To use an API key instead, swap the two lines below.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use this run's GITHUB_TOKEN (limited by `permissions` above). Without it
          # the action needs the Claude GitHub App installed on the repository.
          github_token: ${{ github.token }}
          # Team members open PRs from their forks. The action skips fork PRs by
          # default; they are safe here for the reasons at the top of this file.
          allow_fork_prs: "true"
          # Claude only reads and writes the review to REVIEW_OUTPUT. It has no
          # tool that writes to GitHub; the next step posts the review.
          prompt: |
            /${{ inputs.skill }}
            REPO: ${{ github.repository }}
            PR: ${{ env.PR_NUMBER }}
            PR_SOURCE_DIR: ./pr
            REVIEW_OUTPUT: ./arcus-review-output/review.json
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --max-turns 60
            --add-dir pr
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh api repos/${{ github.repository }}/pulls/*/comments),Bash(gh api repos/${{ github.repository }}/pulls/*/reviews),Bash(git -C pr log:*),Bash(git -C pr show:*),Bash(git -C pr diff:*),Bash(git -C pr merge-base:*),Bash(git -C pr grep:*)"

      # Post one review: the summary is the review body at the top and the line
      # comments are grouped under it. The event is always COMMENT, so the bot
      # never approves or requests changes.
      - name: Post review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REVIEW_FILE: arcus-review-output/review.json
          MODEL: ${{ steps.model.outputs.model }}
          BOT_REV: ${{ steps.bot.outputs.rev }}
        run: |
          if [ ! -s "$REVIEW_FILE" ]; then
            echo "::error::Claude wrote no review. See the claude-code-action step log (skipped or failed)."
            exit 1
          fi
          jq -e '.body | type == "string" and length > 0' "$REVIEW_FILE" > /dev/null
          # A hidden marker lets the next /arcus-review find this review.
          MARK="<!-- arcus-review-bot model=$MODEL${BOT_REV:+ rev=$BOT_REV} -->"
          jq --arg mark "$MARK" '{event: "COMMENT", body: (.body + "\n\n" + $mark),
               comments: [(.comments // [])[] | {path, line, side: "RIGHT", body}]}' \
            "$REVIEW_FILE" > "$RUNNER_TEMP/review-request.json"
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
               --input "$RUNNER_TEMP/review-request.json" > /dev/null; then
            # A line outside the diff makes GitHub reject the whole review.
            # Fall back to one review with the line comments in the body.
            jq --arg mark "$MARK" '{event: "COMMENT",
                 body: (.body + "\n\n---\n" +
                        ([(.comments // [])[] | "#### \(.path):\(.line)\n\(.body)"] | join("\n\n")) +
                        "\n\n" + $mark)}' \
              "$REVIEW_FILE" > "$RUNNER_TEMP/review-request.json"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --input "$RUNNER_TEMP/review-request.json" > /dev/null
          fi

      # Without this a failed run leaves nothing on the PR.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" \
            --body "ARCUS review bot 실행이 실패했습니다. 로그: $RUN_URL"
